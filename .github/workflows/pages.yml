name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build the site
        env:
          JEKYLL_ENV: production
        run: sh scripts/build-cloudflare

      - name: Validate legacy deployment
        run: |
          bundle exec ruby scripts/build-legacy
          bundle exec ruby scripts/check-migration

      - name: Select GitHub deployment
        env:
          LEGACY_REDIRECTS_ENABLED: ${{ vars.LEGACY_REDIRECTS_ENABLED }}
          CHECK_LIVE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          if [ "$LEGACY_REDIRECTS_ENABLED" = "true" ]; then
            if [ "$CHECK_LIVE" = "true" ]; then
              bundle exec ruby scripts/check-live-migration
            fi
            rm -rf _site
            mv _legacy _site
          else
            JEKYLL_ENV=production bundle exec jekyll build --config _config.yml,_config.github.yml
            bundle exec ruby scripts/check-share-metadata
          fi

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
