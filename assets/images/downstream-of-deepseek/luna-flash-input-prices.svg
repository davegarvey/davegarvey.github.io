<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 24 488 244" role="img" aria-labelledby="t d">
  <title id="t">Input prices for OpenAI Luna and DeepSeek Flash, April to September 2026</title>
  <desc id="d">Price per million input tokens, log scale. DeepSeek Flash cost $0.14 from 24 April, rose to $0.22 off-peak and $0.44 at peak times on 16 August, then fell to $0.15 off-peak and $0.30 at peak times on 10 September. OpenAI Luna launched at $1.00 on 9 July, was cut to $0.20 on 30 July and to $0.10 on 22 September.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; }
    .ink { fill: #1f211e; }
    .muted { fill: #62655e; }
    .grid { stroke: #e2e1db; }
    .base { stroke: #c9c8c0; }
    .luna { stroke: #2f6aa8; }
    .luna-fill { fill: #2f6aa8; }
    .flash { stroke: #d0692e; }
    .flash-fill { fill: #d0692e; }
    .ring { stroke: #f8f7f4; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e9e8e2; }
      .muted { fill: #9da199; }
      .grid { stroke: #2e312d; }
      .base { stroke: #3e413c; }
      .luna { stroke: #4a8ad6; }
      .luna-fill { fill: #4a8ad6; }
      .flash { stroke: #dc6e35; }
      .flash-fill { fill: #dc6e35; }
      .ring { stroke: #181a18; }
    }
  </style>

  <g fill="none" stroke-width="1">
    <line class="grid" x1="50" x2="478" y1="37.1" y2="37.1"/>
    <line class="grid" x1="50" x2="478" y1="77.7" y2="77.7"/>
    <line class="grid" x1="50" x2="478" y1="118.2" y2="118.2"/>
    <line class="grid" x1="50" x2="478" y1="158.8" y2="158.8"/>
    <line class="grid" x1="50" x2="478" y1="199.4" y2="199.4"/>
    <line class="base" x1="50" x2="478" y1="240" y2="240"/>
  </g>

  <g class="muted" text-anchor="end">
    <text x="44" y="41.1">$1.60</text>
    <text x="44" y="81.7">$0.80</text>
    <text x="44" y="122.2">$0.40</text>
    <text x="44" y="162.8">$0.20</text>
    <text x="44" y="203.4">$0.10</text>
    <text x="44" y="244">$0.05</text>
  </g>

  <g class="base" stroke-width="1">
    <line x1="50" x2="50" y1="240" y2="245"/>
    <line x1="113" x2="113" y1="240" y2="245"/>
    <line x1="178.1" x2="178.1" y1="240" y2="245"/>
    <line x1="241" x2="241" y1="240" y2="245"/>
    <line x1="306.1" x2="306.1" y1="240" y2="245"/>
    <line x1="371.2" x2="371.2" y1="240" y2="245"/>
    <line x1="434.2" x2="434.2" y1="240" y2="245"/>
  </g>

  <g class="muted" text-anchor="middle">
    <text x="81.5" y="259">Apr</text>
    <text x="145.6" y="259">May</text>
    <text x="209.6" y="259">Jun</text>
    <text x="273.6" y="259">Jul</text>
    <text x="338.7" y="259">Aug</text>
    <text x="402.7" y="259">Sep</text>
  </g>

  <path class="flash" fill="none" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round" stroke-linejoin="round" d="M337.6,153.3 V112.7 H390.1 V135.1 H423.7"/>

  <g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path class="flash" d="M98.3,179.7 H337.6 V153.3 H390.1 V175.7 H423.7"/>
    <path class="luna" d="M257.8,64.6 H301.9 V158.8 H415.3 V199.4 H423.7"/>
  </g>

  <g stroke-width="2">
    <circle class="flash-fill ring" cx="337.6" cy="112.7" r="4" fill-opacity="0.55"/>
    <circle class="flash-fill ring" cx="390.1" cy="135.1" r="4" fill-opacity="0.55"/>
    <circle class="flash-fill ring" cx="98.3" cy="179.7" r="4"/>
    <circle class="flash-fill ring" cx="337.6" cy="153.3" r="4"/>
    <circle class="flash-fill ring" cx="390.1" cy="175.7" r="4"/>
    <circle class="luna-fill ring" cx="257.8" cy="64.6" r="4"/>
    <circle class="luna-fill ring" cx="301.9" cy="158.8" r="4"/>
    <circle class="luna-fill ring" cx="415.3" cy="199.4" r="4"/>
  </g>

  <g class="ink">
    <text x="253.8" y="53.6">OpenAI Luna $1.00</text>
    <text x="94.3" y="168.7">DeepSeek Flash $0.14</text>
    <text x="333.6" y="101.7">Peak hours $0.44</text>
    <text x="430" y="139.1">$0.30</text>
    <text x="430" y="203.4">$0.10</text>
    <text x="430" y="179.7">$0.15</text>
  </g>

</svg>
