<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 225" role="img" aria-labelledby="t d">
  <title id="t">Share of test requests each router sent to the intended tier</title>
  <desc id="d">For 39 short, clear requests and 15 hard ones. Jev: 95% and 100%. Gemma 4 E2B: 74% and 80%. Kev: 77% and 60%. Embeddings: 77% and 53%.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; }
    .small { font-size: 12px; }
    .ink { fill: #1f211e; }
    .muted { fill: #62655e; }
    .grid { stroke: #e2e1db; }
    .link { stroke: #c9c8c0; }
    .easy { fill: #2f6aa8; }
    .hard { fill: #d0692e; }
    .hard-t { fill: #b0561f; }
    .ring { stroke: #f8f7f4; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e9e8e2; }
      .muted { fill: #9da199; }
      .grid { stroke: #2e312d; }
      .link { stroke: #3e413c; }
      .easy { fill: #4a8ad6; }
      .hard, .hard-t { fill: #dc6e35; }
      .ring { stroke: #181a18; }
    }
  </style>
  <g fill="none" stroke-width="1">
    <line class="grid" x1="130.0" x2="130.0" y1="40" y2="198"/>
    <line class="grid" x1="236.7" x2="236.7" y1="40" y2="198"/>
    <line class="grid" x1="343.3" x2="343.3" y1="40" y2="198"/>
    <line class="grid" x1="450.0" x2="450.0" y1="40" y2="198"/>
  </g>
  <g class="muted" text-anchor="middle">
    <text x="130.0" y="216">40%</text>
    <text x="236.7" y="216">60%</text>
    <text x="343.3" y="216">80%</text>
    <text x="450.0" y="216">100%</text>
  </g>
  <g stroke-width="2">
    <circle class="easy ring" cx="136" cy="16" r="5"/>
    <circle class="hard ring" cx="306" cy="16" r="5"/>
  </g>
  <g class="ink small">
    <text x="146" y="20">39 short, clear requests</text>
    <text x="316" y="20">15 hard cases</text>
  </g>
  <text class="ink" x="120" y="66.5" text-anchor="end">Jev</text>
  <line class="link" stroke-width="2" x1="422.6" x2="450.0" y1="62" y2="62"/>
  <circle class="easy ring" stroke-width="2" cx="422.6" cy="62" r="6"/>
  <circle class="hard ring" stroke-width="2" cx="450.0" cy="62" r="6"/>
  <text class="easy small" x="411.6" y="66" text-anchor="end">95%</text>
  <text class="hard-t small" x="461.0" y="66">100%</text>
  <text class="ink" x="120" y="106.5" text-anchor="end">Gemma 4 E2B</text>
  <line class="link" stroke-width="2" x1="313.2" x2="343.3" y1="102" y2="102"/>
  <circle class="easy ring" stroke-width="2" cx="313.2" cy="102" r="6"/>
  <circle class="hard ring" stroke-width="2" cx="343.3" cy="102" r="6"/>
  <text class="easy small" x="302.2" y="106" text-anchor="end">74%</text>
  <text class="hard-t small" x="354.3" y="106">80%</text>
  <text class="ink" x="120" y="146.5" text-anchor="end">Kev</text>
  <line class="link" stroke-width="2" x1="326.9" x2="236.7" y1="142" y2="142"/>
  <circle class="hard ring" stroke-width="2" cx="236.7" cy="142" r="6"/>
  <circle class="easy ring" stroke-width="2" cx="326.9" cy="142" r="6"/>
  <text class="hard-t small" x="225.7" y="146" text-anchor="end">60%</text>
  <text class="easy small" x="337.9" y="146">77%</text>
  <text class="ink" x="120" y="186.5" text-anchor="end">Embeddings</text>
  <line class="link" stroke-width="2" x1="326.9" x2="201.1" y1="182" y2="182"/>
  <circle class="hard ring" stroke-width="2" cx="201.1" cy="182" r="6"/>
  <circle class="easy ring" stroke-width="2" cx="326.9" cy="182" r="6"/>
  <text class="hard-t small" x="190.1" y="186" text-anchor="end">53%</text>
  <text class="easy small" x="337.9" y="186">77%</text>
</svg>
