<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 24 488 244" role="img" aria-labelledby="t d">
  <title id="t">Google search interest in "worktrees", January 2024 to September 2026</title>
  <desc id="d">Weekly worldwide search interest, where 100 is the peak week. Interest was close to zero until late May 2025, when Claude Code became generally available, then rose slowly. It doubled in the week Cursor 2.0 launched parallel agents at the end of October 2025, and nearly tripled, from 19 to 56, in the week the Codex app launched with built-in worktrees in February 2026. It peaked at 100 in late May 2026, then fell, with a second rise in September.</desc>
