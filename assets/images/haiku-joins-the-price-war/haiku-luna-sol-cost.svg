    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; }
    .small { font-size: 12px; }
    .ink { fill: #1f211e; }
    .muted { fill: #62655e; }
    .grid { stroke: #e2e1db; }
    .base { stroke: #c9c8c0; }
    .oa { stroke: #2f6aa8; }
    .oa-fill { fill: #2f6aa8; }
    .sol { stroke: #12355c; }
    .sol-fill { fill: #12355c; }
    .an { stroke: #d0692e; }
    .an-fill { fill: #d0692e; }
    .ring { stroke: #f8f7f4; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e9e8e2; }
      .muted { fill: #9da199; }
      .grid { stroke: #2e312d; }
      .base { stroke: #3e413c; }
      .oa { stroke: #4a8ad6; }
      .oa-fill { fill: #4a8ad6; }
      .sol { stroke: #a6cbf2; }
      .sol-fill { fill: #a6cbf2; }
      .an { stroke: #dc6e35; }
      .an-fill { fill: #dc6e35; }
      .ring { stroke: #181a18; }
    }
  </style>

