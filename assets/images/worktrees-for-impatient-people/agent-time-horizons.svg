<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 24 488 244" role="img" aria-labelledby="t d">
  <title id="t">Length of task the leading AI agent can complete half the time, January 2024 to February 2026</title>
  <desc id="d">METR's 50% time horizon for the leading model, measured in how long the tasks take a skilled person. It rises from 7 minutes for GPT-4o in May 2024 to 1 hour for Claude 3.7 Sonnet in February 2025, 3.4 hours for GPT-5 in August 2025 and 12 hours for Claude Opus 4.6 in February 2026.</desc>
