<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f7f4" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#181a18" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
    {% seo %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="shell">
      <header class="site-header">
        <a class="site-title" href="{{ '/' | relative_url }}">
          <svg class="site-mark" viewBox="0 0 16 16" width="32" height="32" aria-hidden="true" focusable="false">
            <rect class="site-mark-tile" width="16" height="16" rx="3.5"/>
            <path class="site-mark-chevron" d="M3 4h2v1h-2zM4 5h2v1h-2zM5 6h2v1h-2zM6 7h2v1h-2zM6 8h2v1h-2zM5 9h2v1h-2zM4 10h2v1h-2zM3 11h2v1h-2z"/>
            <rect class="site-mark-cursor" x="9" y="10" width="4" height="2"/>
          </svg>
          <span>{{ site.title | escape }}</span>
        </a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
        </nav>
      </header>

      <main id="main-content">
        {{ content }}
      </main>

      <footer class="site-footer">
        <span>© {{ site.time | date: '%Y' }} {{ site.author | escape }}</span>
        <a href="{{ '/feed.xml' | relative_url }}">Feed</a>
      </footer>
    </div>
  </body>
</html>
