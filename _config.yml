title: David Garvey’s Weblog
author: David Garvey
description: Occasional thoughts.
url: https://davegarvey.github.io
baseurl: ""
lang: en-GB

# Default share image for LinkedIn, Bluesky, Slack and the like. jekyll-seo-tag
# reads only page.image, so it is set as a front matter default. A post can
# override it with its own `image:`.
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/social-card-9128ce7b.png
        width: 1200
        height: 630
        alt: "David Garvey’s Weblog: occasional thoughts."
timezone: Europe/Zurich

permalink: /:year/:month/:day/:title/
markdown: kramdown
excerpt_separator: "<!--more-->"

webmaster_verifications:
  google: wvyRR7rO0lJZubnRdZp2oWYLWyUvY0TNfCb6n1ikSMs

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml
  excerpt_only: true

exclude:
  - .github
  - Gemfile
  - Gemfile.lock
  - README.md
  - AGENTS.md
  - ideas.md
  - scripts
  - vendor
