<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 500 260" role="img" aria-labelledby="t d">
  <title id="t">Intelligence against cost per task for Claude Haiku 5.5, GPT-6 Luna and GPT-6.1 Sol</title>
  <desc id="d">Artificial Analysis Intelligence Index against cost per task in US dollars, log scale, at five effort levels from low to max. GPT-6 Luna runs from 22 points at $0.0045 to 38 at $0.07. Claude Haiku 5.5 runs from 29 at $0.02 to 43 at $0.21. GPT-6.1 Sol runs from 42 at $0.13 to 52 at $0.72. At $0.21 per task, Haiku 5.5 on max effort scores 43 and takes 323 seconds to its first token; Sol on medium effort scores 48 and takes 6 seconds.</desc>
