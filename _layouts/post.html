---
layout: default
---
<article>
  <header>
    <h1>{{ page.title | escape }}</h1>
    <p class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
      {%- if page.tags and page.tags.size > 0 %} · {{ page.tags | join: ", " | escape }}{% endif %}
    </p>
  </header>

  <div class="prose">
    {{ content }}
  </div>
</article>
