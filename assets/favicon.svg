<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .tile { fill: #1f211e; }
    .ink { fill: none; stroke: #f8f7f4; }
    .stem { fill: #f8f7f4; }
    .dot { fill: #adb08a; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #e9e8e2; }
      .ink { stroke: #181a18; }
      .stem { fill: #181a18; }
      .dot { fill: #66694a; }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="7"/>
  <circle class="ink" cx="13" cy="18.5" r="5.5" stroke-width="3"/>
  <rect class="stem" x="17" y="6" width="3" height="19.5"/>
  <circle class="dot" cx="24.5" cy="23.5" r="2"/>
</svg>
