    .base { stroke: #c9c8c0; }
    .line { stroke: #2f6aa8; }
    .dot { fill: #2f6aa8; stroke: #f8f7f4; }
    .ring { fill: #f8f7f4; stroke: #2f6aa8; }
    @media (prefers-color-scheme: dark) {
      .muted { fill: #9da199; }
      .grid { stroke: #2e312d; }
      .base { stroke: #3e413c; }
      .line { stroke: #4a8ad6; }
      .dot { fill: #4a8ad6; stroke: #181a18; }
      .ring { fill: #181a18; stroke: #4a8ad6; }
    }
  </style>

